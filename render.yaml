services:
  - type: web
    name: kabadiwala-api-free
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r database_and_integration/requirements-free.txt
    startCommand: cd database_and_integration && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DISABLE_ML
        value: "true"
      - key: KABADIWALA_DATABASE_URL
        sync: false
      - key: KABADIWALA_DB_SSL_CA
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: https://kabadiwalaconnect-8c8c4.web.app
