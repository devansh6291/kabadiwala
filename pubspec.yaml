name: kabadiwala_connect
description: Connecting kabadiwalas to authorized recyclers
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # In-app custom camera preview (used instead of image_picker's system camera)
  camera: ^0.11.0+2

  # SHA-256 hash chaining for the Form-6 manifest checkpoints
  crypto: ^3.0.3
  # Photo capture for lots
  image_picker: ^1.1.2

  # GPS tagging at lot creation
  geolocator: ^13.0.1

  # Runtime permission prompts (camera/location)
  permission_handler: ^11.3.1

  # Unique, on-device lot IDs (matches data dictionary: id is a uuid)
  uuid: ^4.5.1

  # Human-friendly relative timestamps in the lot history list
  intl: ^0.19.0

  # Local offline storage — saves data on the phone even with no internet connection

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_test: ^1.0.1

flutter:
  uses-material-design: true